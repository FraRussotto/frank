version: '3.8'

services:
  frank:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frank-second-brain
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - frank-data:/app/database
      - frank-uploads:/app/uploads
      - frank-config:/app/config

volumes:
  frank-data:
  frank-uploads:
  frank-config:

